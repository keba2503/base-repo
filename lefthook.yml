pre-commit:
  jobs:
    - name: staged-checks
      group:
        parallel: true
        jobs:
          - name: eslint
            root: apps/web
            glob: "*.{js,jsx,ts,tsx}"
            run: bunx eslint --max-warnings 0 {staged_files}
          - name: architecture
            run: bun scripts/architecture/check.ts {staged_files}
    - name: typecheck
      run: bun run typecheck

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
    review-trailer:
      run: bun run review-trailer {1}

pre-push:
  commands:
    check:
      run: bun run check
