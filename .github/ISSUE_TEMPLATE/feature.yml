name: Feature request
description: Propose new functionality for the base repository or a derived project
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or gap does this address
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead
    validations:
      required: true
  - type: input
    id: layer
    attributes:
      label: Layer(s) affected
      description: domain, application, contracts, adapters, infrastructure, web, worker
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
